apply plugin: 'com.android.application'

android {
    namespace "com.mdorchestra.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mdorchestra.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Without an explicit debug signingConfig, the Android Gradle Plugin
    // auto-generates ~/.android/debug.keystore the first time it's needed
    // -- fine on a real dev machine, where that file persists across
    // builds, but every build here runs in a fresh, throwaway Docker
    // container with no such history. Each build was silently getting its
    // own brand-new random debug key, so Android correctly refused to
    // install a newer build as an *update* over an older one signed with
    // a different key (a real security check working as intended) --
    // forcing a full uninstall every single time just to test a change.
    // Pointing debug builds at one committed, fixed keystore instead (its
    // password is Android's own long-published, non-secret debug
    // default -- this is deliberately not a real secret) means every
    // build from here on signs with the same key, so updates install
    // like updates.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// capacitor-cordova-android-plugins (the Cordova compatibility bridge
// Capacitor still ships for plugins written against the older Cordova
// API) pulls in an old, pre-1.8 Kotlin stdlib split across separate
// kotlin-stdlib-jdk7/-jdk8 artifacts. Since Kotlin 1.8, that same
// functionality lives directly in kotlin-stdlib itself, so having both on
// the classpath at once is a real duplicate-class conflict, not just a
// version mismatch Gradle can quietly resolve on its own — excluding the
// two old split artifacts here is the standard fix for it.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
