<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1c1f33"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </radialGradient>
    <linearGradient id="baton" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d3323"/>
      <stop offset="55%" stop-color="#c9974f"/>
      <stop offset="100%" stop-color="#f6dfa8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="220" height="220" rx="42" fill="url(#bg)"/>

  <!-- code brackets -->
  <text x="46" y="142" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="80" font-weight="700" fill="#6c5ce7">&lt;</text>
  <text x="122" y="142" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="80" font-weight="700" fill="#6c5ce7">/&gt;</text>

  <!-- conductor's baton, tip glowing up and to the right -->
  <g filter="url(#glow)">
    <line x1="76" y1="156" x2="150" y2="66" stroke="url(#baton)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="66" r="5.5" fill="#fdf6e3"/>
    <!-- a short curved flourish trailing the tip, echoing a conductor's motion -->
    <path d="M162 60 Q178 54 188 64" stroke="#0ea5a5" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <circle cx="190" cy="66" r="3" fill="#0ea5a5"/>
    <circle cx="180" cy="46" r="2.2" fill="#0ea5a5" opacity="0.7"/>
  </g>
</svg>
