<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // Applied synchronously, before any CSS paints, so a saved dark-mode
  // choice doesn't flash light-then-dark on load. Mirrors js/utils/theme.js's
  // storage key/format; kept inline (not imported) specifically so it runs
  // before the stylesheets below are applied.
  (function () {
    try {
      var t = localStorage.getItem('md-dashboard-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* ignore */ }
  }());
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MD.Orchestra</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="app-shell">
  <header id="app-header">
    <button id="sidebar-toggle" class="btn btn-ghost" type="button" title="Toggle sections" aria-label="Toggle sections">☰</button>
    <div class="brand">
      <span class="brand-title">MD.Orchestra</span>
      <span class="brand-subtitle">read · annotate · ask Claude · save back</span>
    </div>

    <div class="toolbar-group">
      <button id="open-file-btn" class="btn" type="button">Open .md file</button>
      <input id="file-input" type="file" accept=".md,.markdown,.txt" />
      <button id="open-folder-btn" class="btn" type="button" title="Open a whole directory of Markdown files">📁 Open folder</button>
      <input id="folder-input" type="file" webkitdirectory multiple />
    </div>

    <div class="spacer"></div>

    <button id="dirty-indicator" class="dirty-indicator" type="button" title="Save to disk (Ctrl/⌘+Shift+S) — Ctrl/⌘+S saves just the section you're editing">
      <span class="dot"></span><span id="dirty-text">No document loaded</span>
    </button>
    <div class="toolbar-group">
      <button id="map-view-btn" class="btn" type="button" disabled>🗺️ Map</button>
    </div>
    <div class="toolbar-group toolbar-group-end">
      <button id="source-btn" class="btn" type="button" disabled>Source</button>
      <button id="shortcuts-btn" class="btn btn-ghost" type="button" title="Keyboard shortcuts">⌨</button>
      <button id="settings-btn" class="btn" type="button">Settings ⚙</button>
    </div>
  </header>

  <div id="app-body">
    <aside id="sidebar">
      <div class="sidebar-toolbar">
        <button id="add-file-btn" class="btn btn-icon" type="button" title="Add file" aria-label="Add file">📄<span class="btn-icon-plus">+</span></button>
        <button id="add-section-btn" class="btn btn-icon" type="button" disabled title="Add section" aria-label="Add section">📑<span class="btn-icon-plus">+</span></button>
        <button id="changes-btn" class="btn btn-icon" type="button" title="Changes" aria-label="Changes">📝<span id="changes-badge" class="changes-badge" hidden>0</span></button>
      </div>
      <section class="sidebar-section" id="explorer-section">
        <button type="button" class="sidebar-section-head" id="explorer-toggle">
          <span class="sidebar-section-chevron">▾</span>
          <span class="sidebar-section-title">Explorer</span>
        </button>
        <div class="sidebar-section-body" id="explorer-body">
          <div id="workspace-tree"></div>
        </div>
      </section>
      <div id="sidebar-resize-handle" class="sidebar-resize-handle" title="Drag to resize Explorer/Outline"></div>
      <section class="sidebar-section" id="outline-section">
        <button type="button" class="sidebar-section-head" id="outline-toggle">
          <span class="sidebar-section-chevron">▾</span>
          <span class="sidebar-section-title">Outline</span>
        </button>
        <div class="sidebar-section-body" id="outline-body">
          <div id="heading-tree"></div>
        </div>
      </section>
    </aside>

    <main id="main-panel">
      <div id="breadcrumb-bar"></div>
      <div id="view-mode-bar" class="view-mode-bar" hidden role="tablist">
        <button type="button" id="view-mode-full-btn" class="view-mode-tab" role="tab" title="Read and edit the whole file as one continuous page of raw Markdown">📝 Full text</button>
        <button type="button" id="view-mode-sections-btn" class="view-mode-tab" role="tab" title="Browse the document broken into per-heading cards you can drill into">🗃️ Sections</button>
      </div>
      <div id="section-view-wrap">
        <div id="empty-state">
          <h2>No document loaded yet</h2>
          <p>Open a Markdown file or a whole folder of them, or drop one anywhere on this page, to see it broken into cards you can browse, annotate, and ask Claude about.</p>
          <span id="drop-hint">…or drag a .md file here</span>
        </div>
        <div id="section-view" hidden></div>
      </div>
    </main>

    <div id="preview-resize-handle" class="preview-resize-handle" hidden title="Drag to resize the preview"></div>
    <aside id="preview-panel" hidden></aside>
    <button id="preview-edge-toggle" class="edge-toggle" type="button" disabled title="A clean, GitHub/PDF-style read view">👁 Preview</button>
  </div>
</div>

<script>
  // Mermaid: don't auto-scan the whole page on load; render.js calls mermaid.run() explicitly per section.
  if (window.mermaid) {
    window.mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
